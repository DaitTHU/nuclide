[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nuclide"
version = "0.1.0"
description = "Natural, unit-aware operations on nuclides and radioactive decay"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT AND CC-BY-3.0"
license-files = ["LICENSE", "src/nuclide/data/NOTICE.md"]
authors = [{name = "Dait"}]
keywords = ["nuclide", "isotope", "radioactivity", "nuclear-physics", "units"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = ["unitx>=0.17.13"]

[project.optional-dependencies]
test = ["pytest", "ruff", "pyright", "build", "twine"]

[project.urls]
Source = "https://github.com/DaitTHU/nuclide"
Issues = "https://github.com/DaitTHU/nuclide/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nuclide = ["py.typed", "data/*.json", "data/NOTICE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
